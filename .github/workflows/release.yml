name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
  workflow_dispatch:

jobs:
  vcpkg-muslc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve VCPKG_BASE_VERSION
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "base=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build in Alpine (musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/koomx/kumo-std20-alpine320-amd64:latest \
            sh -c "
              set -ex
              git config --global --add safe.directory /src
              cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS='-s -static-libgcc -static-libstdc++' \
                -DVCPKG_BASE_VERSION=${{ steps.ver.outputs.base }} \
                -DVCPKG_VERSION=${{ github.sha }} \
                -DVCPKG_EMBED_GIT_SHA=ON \
                -DVCPKG_ADD_SOURCELINK=OFF \
                -DVCPKG_DEVELOPMENT_WARNINGS=OFF \
                -DVCPKG_OFFICIAL_BUILD=OFF \
                -DBUILD_TESTING=OFF \
                -B build -S .
              cmake --build build -j\$(nproc)
              cp build/vcpkg /src/vcpkg-muslc
            "
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-muslc
          path: vcpkg-muslc

  vcpkg-glibc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve VCPKG_BASE_VERSION
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "base=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build in Ubuntu 20.04 (glibc)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/koomx/kumo-std17-ubuntu20-amd64:latest \
            bash -c "
              set -ex
              git config --global --add safe.directory /src
              cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DVCPKG_BASE_VERSION=${{ steps.ver.outputs.base }} \
                -DVCPKG_VERSION=${{ github.sha }} \
                -DVCPKG_EMBED_GIT_SHA=ON \
                -DVCPKG_ADD_SOURCELINK=OFF \
                -DVCPKG_DEVELOPMENT_WARNINGS=OFF \
                -DVCPKG_OFFICIAL_BUILD=OFF \
                -DBUILD_TESTING=OFF \
                -B build -S .
              cmake --build build -j\$(nproc)
              cp build/vcpkg /src/vcpkg-glibc
            "
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-glibc
          path: vcpkg-glibc

  vcpkg-glibc-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Resolve VCPKG_BASE_VERSION
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "base=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build in Ubuntu 20.04 arm64 (glibc)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/koomx/kumo-std17-ubuntu20-arm64:latest \
            bash -c "
              set -ex
              git config --global --add safe.directory /src
              cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DVCPKG_BASE_VERSION=${{ steps.ver.outputs.base }} \
                -DVCPKG_VERSION=${{ github.sha }} \
                -DVCPKG_EMBED_GIT_SHA=ON \
                -DVCPKG_ADD_SOURCELINK=OFF \
                -DVCPKG_DEVELOPMENT_WARNINGS=OFF \
                -DVCPKG_OFFICIAL_BUILD=OFF \
                -DBUILD_TESTING=OFF \
                -B build -S .
              cmake --build build -j\$(nproc)
              cp build/vcpkg /src/vcpkg-glibc-arm64
            "
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-glibc-arm64
          path: vcpkg-glibc-arm64

  vcpkg-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve VCPKG_BASE_VERSION
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "base=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Install ninja
        run: brew install ninja
      - name: Configure
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DVCPKG_BASE_VERSION=${{ steps.ver.outputs.base }} \
            -DVCPKG_VERSION=${{ github.sha }} \
            -DVCPKG_EMBED_GIT_SHA=ON \
            -DVCPKG_ADD_SOURCELINK=OFF \
            -DVCPKG_DEVELOPMENT_WARNINGS=OFF \
            -DVCPKG_OFFICIAL_BUILD=OFF \
            -DBUILD_TESTING=OFF \
            -B build -S .
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Stage binary
        run: cp build/vcpkg vcpkg-macos
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-macos
          path: vcpkg-macos

  vcpkg-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve VCPKG_BASE_VERSION
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "base=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: curl/curl
          ref: curl-8_11_1
          path: curl-src
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install ninja
        shell: pwsh
        run: choco install ninja -y
      - name: Build libcurl (Schannel, no vcpkg)
        shell: cmd
        run: |
          set "VCPKG_ROOT="
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_MAKE_PROGRAM=ninja ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DBUILD_CURL_EXE=OFF ^
            -DBUILD_TESTING=OFF ^
            -DCURL_USE_SCHANNEL=ON ^
            -DCURL_USE_LIBPSL=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\curl-prefix ^
            -B curl-build -S curl-src
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
          cmake --build curl-build -j
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
          cmake --install curl-build
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
      - name: Configure and Build (MSVC)
        shell: cmd
        run: |
          set "VCPKG_ROOT="
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_MAKE_PROGRAM=ninja ^
            -DCMAKE_PREFIX_PATH=%GITHUB_WORKSPACE%\curl-prefix ^
            -DVCPKG_BASE_VERSION=${{ steps.ver.outputs.base }} ^
            -DVCPKG_VERSION=${{ github.sha }} ^
            -DVCPKG_EMBED_GIT_SHA=ON ^
            -DVCPKG_ADD_SOURCELINK=OFF ^
            -DVCPKG_DEVELOPMENT_WARNINGS=OFF ^
            -DVCPKG_OFFICIAL_BUILD=OFF ^
            -DVCPKG_BUILD_TLS12_DOWNLOADER=ON ^
            -DBUILD_TESTING=OFF ^
            -B build -S .
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
          cmake --build build -j
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
          copy /Y build\vcpkg.exe vcpkg.exe
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg.exe
          path: vcpkg.exe

  vcpkg-arm64-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve VCPKG_BASE_VERSION
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "base=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: curl/curl
          ref: curl-8_11_1
          path: curl-src
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Install ninja
        shell: pwsh
        run: choco install ninja -y
      - name: Build libcurl (Schannel, no vcpkg)
        shell: cmd
        run: |
          set "VCPKG_ROOT="
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_MAKE_PROGRAM=ninja ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DBUILD_CURL_EXE=OFF ^
            -DBUILD_TESTING=OFF ^
            -DCURL_USE_SCHANNEL=ON ^
            -DCURL_USE_LIBPSL=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\curl-prefix ^
            -B curl-build -S curl-src
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
          cmake --build curl-build -j
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
          cmake --install curl-build
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
      - name: Configure and Build (MSVC)
        shell: cmd
        run: |
          set "VCPKG_ROOT="
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_MAKE_PROGRAM=ninja ^
            -DCMAKE_PREFIX_PATH=%GITHUB_WORKSPACE%\curl-prefix ^
            -DVCPKG_BASE_VERSION=${{ steps.ver.outputs.base }} ^
            -DVCPKG_VERSION=${{ github.sha }} ^
            -DVCPKG_EMBED_GIT_SHA=ON ^
            -DVCPKG_ADD_SOURCELINK=OFF ^
            -DVCPKG_DEVELOPMENT_WARNINGS=OFF ^
            -DVCPKG_OFFICIAL_BUILD=OFF ^
            -DVCPKG_BUILD_TLS12_DOWNLOADER=ON ^
            -DBUILD_TESTING=OFF ^
            -B build -S .
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
          cmake --build build -j
          IF %ERRORLEVEL% NEQ 0 exit /B %ERRORLEVEL%
          copy /Y build\vcpkg.exe vcpkg-arm64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-arm64.exe
          path: vcpkg-arm64.exe

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - vcpkg-muslc
      - vcpkg-glibc
      - vcpkg-glibc-arm64
      - vcpkg-macos
      - vcpkg-exe
      - vcpkg-arm64-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten and checksum
        run: |
          mkdir -p drop
          find artifacts -type f -exec cp {} drop/ \;
          cd drop
          sha256sum * | tee SHA256SUMS
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          name: ${{ github.ref_name }}
          files: |
            drop/*
